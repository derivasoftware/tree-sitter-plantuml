requirement:
  id: SREQ-00002-1
  title: The grammar shall parse PlantUML class diagrams
  description: >
    The grammar shall parse the PlantUML class-diagram language as PlantUML
    defines it: class, abstract class, interface, enum and annotation
    declarations (including quoted display names, aliases, generics and
    stereotypes); members with visibility markers and static/abstract
    modifiers; the relation operators — inheritance, realization,
    composition, aggregation, dependency, association — with cardinalities
    and labels; package and namespace grouping; notes; and hide/show
    directives. Class diagrams are the first supported diagram type and
    define the v1 scope boundary.
  rationale: >
    Class diagrams are the structurally richest and most tooling-relevant
    PlantUML diagram type: design documentation, code-design drift checking
    and model extraction all consume them. Defining the subset in PlantUML's
    own terms — rather than any single consumer's subset — keeps the grammar
    a general-purpose product.
  owner: dcoello-dev
  status: APPROVED
  asil: QM
  parent_ids:
    - SREQ-00001-1
  tags:
    - class-diagram
    - scope
