requirement:
  id: SREQ-00005-1
  title: The project shall version the syntax-tree node names under semantic versioning
  description: >
    The node vocabulary of the grammar — named node types, field names and
    their containment shape — shall be treated as the project's public API
    and versioned under semantic versioning: renaming or removing a released
    node type or field is a breaking change requiring a major version bump;
    adding new node types for newly supported constructs is a minor change.
  rationale: >
    Every downstream consumer binds to node names: editor highlight and
    injection queries, formatters walking the tree, and analysis tools
    extracting entities. Unlike a library API, nothing in the toolchain
    breaks loudly when a node is renamed — queries silently stop matching.
    An explicit semver contract on the node vocabulary is the only way
    consumers can pin safely, and it forces node-naming decisions to be made
    deliberately at design time rather than drifting release to release.
  owner: dcoello-dev
  status: DRAFT
  asil: QM
  parent_ids:
    - SREQ-00001-1
  tags:
    - api-stability
    - versioning
