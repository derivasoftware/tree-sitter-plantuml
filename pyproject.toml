[build-system]
requires = ["setuptools>=62.4.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tree-sitter-plantuml"
description = "PlantUML grammar for tree-sitter"
version = "0.9.6"
keywords = ["incremental", "parsing", "tree-sitter", "plantuml"]
classifiers = [
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Compilers",
  "Topic :: Text Processing :: Linguistic",
  "Typing :: Typed",
]
authors = [{ name = "dcoello-dev" }]
requires-python = ">=3.10"
license.text = "MIT"
readme = "README.md"

[project.urls]
Homepage = "https://github.com/derivasoftware/tree-sitter-plantuml"

[project.optional-dependencies]
core = ["tree-sitter~=0.24"]

[tool.cibuildwheel]
build = "cp310-*"
build-frontend = "build"

[tool.pytest.ini_options]
markers = [
  "system: whole-corpus sweeps — losslessness round-trips and standard conformance",
]
