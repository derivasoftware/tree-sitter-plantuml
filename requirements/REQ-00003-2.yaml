requirement:
  id: REQ-00003-2
  title: The grammar shall parse entity members with visibility markers and static and abstract modifiers
  description: >
    The grammar shall parse entity members with visibility markers and
    static and abstract modifiers, covering typed attributes, methods with
    parameter lists, and free-text member lines — a leading identifier
    followed by arbitrary prose parses as an attribute with an opaque
    raw_text payload instead of an ERROR.
  rationale: >
    Member lines carry the class contract; visibility and modifiers must be
    distinct nodes for consumers to query. Revision 2 adds free-text member
    lines, found in the wild corpus (prose contracts documented as members),
    which previously produced ERROR nodes.
  status: APPROVED
  asil: QM
  parent_ids:
    - SREQ-00002-1
  tags:
    - class-diagram
    - members
