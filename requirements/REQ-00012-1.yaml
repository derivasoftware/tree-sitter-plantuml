requirement:
  id: REQ-00012-1
  title: The grammar shall parse unknown identifier-headed statements as raw lines
  description: >
    The grammar shall parse unknown identifier-headed statements as raw lines
  rationale: >
    The current frontier is lexical: a line whose head is an unknown identifier commits the parser to the relation rule and errors. Closing this gap needs a scanner-assisted or GLR-soup fallback so the raw_line guarantee of SREQ-00003-1 holds for every statement head. Captured as friction during the notes/display milestone; DRAFT is the backlog state — W-REQ-UNAPPROVED on this artefact is the tracked debt signal.
  status: DRAFT
  asil: QM
  parent_ids:
    - SREQ-00003-1
  tags:
    - backlog
    - frontier-policy
