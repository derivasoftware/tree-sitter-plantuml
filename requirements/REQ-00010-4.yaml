requirement:
  id: REQ-00010-4
  title: The grammar shall parse note statements in positional, targeted, on-link, block, floating and colored forms
  description: >
    The grammar shall parse note statements in positional, targeted, on-link,
    block and floating forms: a position with optional target entity, a note
    attached to the preceding relation (note [position] on link), the
    sequence-style note over one or more entities, block bodies closed by
    end note, and floating notes declared with an alias — quoted inline
    (note "text" as N) or unquoted with a block body (note as N … end note).
    Targets may be member-qualified (Entity::member or Entity::"member").
    Targeted and over notes accept a trailing color; across is a position.
  rationale: >
    Notes are first-class content: position, target entity, alias, color
    and text become queryable fields, while block bodies stay opaque raw
    lines. Revision 4 (sequence-conformance matrix) adds the optional
    color on targeted/over forms and the across position; hnote/rnote
    and slash-aligned notes stay deliberately raw pending evidence.
  status: APPROVED
  asil: QM
  parent_ids:
    - SREQ-00002-1
  tags:
    - notes
