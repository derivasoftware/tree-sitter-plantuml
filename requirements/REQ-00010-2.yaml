requirement:
  id: REQ-00010-2
  title: The grammar shall parse note statements in positional, targeted, on-link, block and floating forms
  description: >
    The grammar shall parse note statements in positional, targeted, on-link,
    block and floating forms: a position with optional target entity, a note
    attached to the preceding relation (note [position] on link), block bodies
    closed by end note, and floating notes declared with an alias.
  rationale: >
    Notes are first-class class-diagram content: position, target entity,
    alias and text become queryable fields, while block bodies stay opaque
    raw lines a formatter passes through verbatim. Revision 2 adds the
    on-link form, which attaches to the preceding relation.
  status: APPROVED
  asil: QM
  parent_ids:
    - SREQ-00002-1
  tags:
    - class-diagram
    - notes
