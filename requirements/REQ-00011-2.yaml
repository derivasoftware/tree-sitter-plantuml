requirement:
  id: REQ-00011-2
  title: The grammar shall parse hide, show, remove and restore display directives
  description: >
    The grammar shall parse hide, show, remove and restore display
    directives as a structured verb plus an opaque target token.
  rationale: >
    Display directives control rendering of declared entities; a structured
    verb-plus-target node lets consumers normalize them without interpreting
    the target vocabulary, which stays an opaque token. Revision 2 adds the
    remove and restore verbs, which share the hide/show target grammar.
  status: APPROVED
  asil: QM
  parent_ids:
    - SREQ-00002-1
  tags:
    - class-diagram
    - display
