requirement:
  id: REQ-00026-3
  title: The grammar shall parse activity actions and swimlanes structurally
  description: >
    The grammar shall parse single-line activity actions (:text; and the
    SDL terminators, an optional #color prefix, the backward marker,
    trailing stereotypes tolerated) as activity_action with the text as
    a child token, and swimlanes (|Name|, colored variant) as swimlane.
    Multiline action bodies and the braced group, rectangle and card
    blocks stay raw. Control flow is REQ-00029-1.
  rationale: >
    Revision 3 (DDEV-464): control flow moved out of this requirement
    into REQ-00029-1 and the colored action head joined the action
    token, so "the rest of the chapter as raw" no longer holds.
    Revision 2: the consumer arrived — call-level correlation (an
    action invokes a method; the lane names the receiver), so
    single-line actions (:text; and the SDL terminators, trailing
    stereotypes tolerated) and swimlanes (|Name|, colored variant)
    become activity_action/swimlane nodes with their text as a child
    token. Control flow (if/while/fork/repeat/switch), multiline
    action bodies, colored #x:action; heads and connectors stay
    deliberately raw — their consumer would be native rendering.
    Sequence spacing lines (|||, ||45||) keep falling to raw: the
    swimlane token requires a non-pipe after the first pipe. The
    never-ERROR guarantee is untouched.
  status: APPROVED
  asil: QM
  parent_ids:
    - SREQ-00009-1
  tags:
    - activity
    - frontier-policy
