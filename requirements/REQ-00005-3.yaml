requirement:
  id: REQ-00005-3
  title: The grammar shall parse package, namespace and together grouping blocks
  description: >
    The grammar shall parse package, namespace and together grouping blocks.
    Package and namespace blocks carry a name and an optional stereotype;
    together blocks are anonymous. All three nest arbitrary statements.
    Namespace declarations may also appear bodyless — name and optional
    stereotype with no braced block — as commonly used in HLD overviews.
  rationale: >
    Grouping blocks nest arbitrary statements; they exercise the recursive
    statement structure. Revision 3 adds the bodyless namespace declaration,
    which accounted for dozens of ERROR trees in the wild-corpus evaluation
    over the argos design diagrams.
  status: APPROVED
  asil: QM
  parent_ids:
    - SREQ-00002-1
  tags:
    - class-diagram
    - grouping
