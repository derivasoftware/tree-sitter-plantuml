requirement:
  id: REQ-00026-1
  title: The grammar shall parse the activity chapter as raw lines without frontier errors
  description: >
    The grammar shall parse the activity chapter as raw lines without frontier errors
  rationale: >
    Raw-tier conformance for plantuml.com/activity-diagram-beta: every
    construct parses lossless with zero ERROR, none structural — there
    is no consumer (the renderer draws classes and sequences; actions
    are not indexable entities) and zero corpus evidence. The frontier
    work this required: bare end / else (label) / break are raw at
    diagram level only (inside a frame the same tokens keep their exact
    closing semantics — the alternative is simply absent from frame
    bodies), and braced `group X {` heads are scanner-claimed raw while
    braceless sequence groups stay frames. Structural promotion is
    gated on a consumer arriving — the likely one being the argos
    process-graph work, where PaC processes are flowcharts.
  status: APPROVED
  asil: QM
  parent_ids:
    - SREQ-00009-1
  tags:
    - activity
    - standard-conformance
    - frontier-policy
