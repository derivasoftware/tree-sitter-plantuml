# Argos repository configuration. See ConfigReader for the schema.
#
# [project].asil declares the project's safety integrity level. NA
# enables the Owner Protocol autonomous loop (PROTOCOL-autonomous-loop); QM and
# above reserve the Owner role to a human.

[project]
asil = "NA"

[sources]
typescript = ["."]

# The LLD chapters model the grammar itself — the rule families of
# grammar.js (envelope, classes, members, relations, sequence, activity,
# grouping, notes, queries) plus the external scanner's frontier and the
# python packaging — as module boxes. They are the specification of a
# DSL, not OO code: no reader extracts grammar.js rules, and the C
# scanner's functions ride the generated parser.c's noise. The class-axis
# correlator therefore cannot bind them by construction; the boxes stay
# as design documentation, exempted with this cause (REQ-00516-1).
[[diagnose.exempt]]
code = "W-DESIGN-NO-FUNCTION"
sources = ["CL_Packaging", "CL_Frontier"]
reason = "two boxes document code no reader scans: CL_Packaging names the wheel build steps (language(), build_wheels(), smoke_wheel()) that live in the CI and the build scripts, CL_Frontier names the C functions of the external scanner (src/scanner.c); both stay as design documentation of the grammar, as the chapters do (REQ-00516-1)"
