repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^src/
      - id: end-of-file-fixer
        exclude: ^src/
      - id: check-yaml
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://gitlab.semantiqa.dev/deriva/plantuml/plantuml-fmt
    rev: v0.3.2
    hooks:
      - id: plantuml-fmt
        # the standard corpus fixtures reproduce plantuml.com verbatim;
        # formatting them would falsify what they attest
        exclude: '^examples/'
