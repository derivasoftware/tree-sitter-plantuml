verification:
  id: VER-00029-2
  req_id: REQ-00028-2
  title: The cpp-members corpus pins every C++ signature shape and the frontier
  description: >
    test/corpus/cpp-members.txt extends its destructor and
    operator cases with fourteen signature shapes: qualified,
    templated (to three nesting levels), pointer and reference return
    types, const-led types with trailing cv-qualifiers, deleted
    constructors and assignments, the cv-qualifier between parens and
    the canonical colon, callable parameters with inner parentheses,
    the coexistence of the canonical colon form, and the unclosed
    template bracket degrading to raw text with no ERROR node.
    Issue #5 adds method-level template parameters: name<T>(…)
    behind a C++ return type, behind a plain identifier type, and
    in the canonical colon form — and pins the frontier that a
    plain type without the template clause stays an attribute. The
    revision (2) adds the empty-clause frontier case: name<>( parses
    as an attribute, never an ERROR.
    tests/test_grammar.py runs the file through the tree-sitter
    harness; the losslessness sweep (tests/test_round_trip.py) covers
    the same inputs byte-for-byte.
  method: test
  test_ids:
    - tests/test_grammar.py::test_corpus_cpp_members
  status: APPROVED
